# carino-pbx runtime directories.
#
# /run/php-fpm is normally created by Fedora's php-fpm package, which this
# image does not install (the runtime is Remi's PHP 8.2 — see
# config/purposes/pbx.conf). The pool still puts its socket there because that
# path carries the httpd_var_run_t SELinux context Apache is allowed to reach.
d /run/php-fpm 0755 root root -
d /var/log/php-fpm 0700 root root -
