; FreePBX PHP-FPM pool (carino-pbx).
;
; Separate from Remi's stock [www] pool so the FreePBX runtime is not affected
; by whatever that one is configured to do. It runs as the Asterisk user for
; the same reason Apache does (see /etc/httpd/conf.d/freepbx.conf).
;
; The socket lives in /run/php-fpm, not under /var/opt/remi/php82 where SCL
; packages default: /run/php-fpm carries the httpd_var_run_t SELinux context
; in the base targeted policy, which is what lets Apache connect to it with
; SELinux enforcing. /usr/lib/tmpfiles.d/carino-pbx.conf creates the directory.
[freepbx]
user = asterisk
group = asterisk

listen = /run/php-fpm/freepbx.sock
listen.owner = asterisk
listen.group = asterisk
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

; FreePBX module installs and backups are long, memory-hungry requests.
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[upload_max_filesize] = 120M
php_admin_value[post_max_size] = 120M
php_admin_value[error_log] = /var/log/php-fpm/freepbx-error.log
php_admin_flag[log_errors] = on
