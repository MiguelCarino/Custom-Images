# FreePBX web UI (carino-pbx).
#
# Apache runs as asterisk:asterisk rather than apache:apache. FreePBX writes
# into its own web root (module installs, backups, recordings) and shares those
# files with Asterisk itself, so a single owner for both is not a shortcut —
# `fwconsole chown` sets the whole tree to the Asterisk user and a web server
# running as anyone else cannot then write to it. conf.d is included from
# httpd.conf after the stock User/Group lines, so these win.
User asterisk
Group asterisk

DocumentRoot "/var/www/html"

<Directory "/var/www/html">
    # FreePBX ships .htaccess files and relies on them being honoured.
    AllowOverride All
    Options FollowSymLinks
    Require all granted
</Directory>

# PHP 8.2 from Remi's SCL packages, over the FreePBX-specific pool defined in
# /etc/opt/remi/php82/php-fpm.d/freepbx.conf. Fedora's own PHP (8.5) is not
# installed on this image and would not be usable here anyway — FreePBX 17
# requires 8.2 and upstream states 8.3+ must not be present.
<FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php-fpm/freepbx.sock|fcgi://localhost"
</FilesMatch>

DirectoryIndex index.php index.html

# The UI is served over plain HTTP on first boot: a fresh appliance has no
# certificate and no name yet. Terminate TLS once the box has one — mod_ssl is
# installed for exactly that, and FreePBX has a certificate manager.
