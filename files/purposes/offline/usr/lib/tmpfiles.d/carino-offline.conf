# carino-offline — the paths this appliance owns at runtime.

# L+ replaces whatever /etc/resolv.conf currently is. On a Fedora bootc base it
# is a symlink to ../run/systemd/resolve/stub-resolv.conf (verified inside
# carino-layer-de-headless), and systemd-resolved is masked on this image, so
# that symlink would dangle and the box would have no resolver at all — on the
# machine whose entire product is resolving names. Pointing it at 127.0.0.1
# means the appliance uses the named it is running: the same answers, from the
# same cache and the same view, that it hands the LAN.
#
# Escape hatch: a site that needs a different file drops one with the SAME
# NAME in /etc/tmpfiles.d/, which takes precedence over /usr/lib/tmpfiles.d/.
# Nothing here has to be edited in /usr to be overridden.
L+ /etc/resolv.conf - - - - /usr/share/carino-offline/resolv.conf

# Content roots, created empty at boot rather than shipped inside the image's
# /var. bootc copies the image's /var into the machine once at install and
# never again, so a directory baked there with content in it is frozen at the
# version of whichever build first installed the machine while appearing to
# update with the rest of the OS. The mirror, the ZIM library and the site
# trees are data: they arrive by rsync or by courier and must stay writable.
d /var/lib/carino-offline        0755 root root -
d /var/lib/carino-offline/mirror 0755 root root -
d /var/lib/carino-offline/www    0755 root root -
d /var/lib/kiwix                 0755 root root -

# /var/lib/caddy is the one directory on this appliance that an RPM bakes into
# the image's /var with non-root ownership (verified: caddy-2.10.2-9.fc44 ships
# it 0750 caddy:caddy, and caddy is the caddy user's home per
# /usr/lib/sysusers.d/caddy.conf). caddy ships no tmpfiles.d entry of its own —
# bind does, and /usr/lib/tmpfiles.d/named.conf recreates its whole /var/named
# tree at boot — so without this line the directory holding Caddy's internal CA
# root exists only because the installing image happened to carry it, with no
# way to recreate it after a restore. It is on the crown-jewel backup list in
# /etc/motd.d/carino-offline; this makes it reproducible.
d /var/lib/caddy                 0750 caddy caddy -
