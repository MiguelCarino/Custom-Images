# Owned by /usr/lib/tmpfiles.d/carino-offline.conf — /etc/resolv.conf is a
# symlink to this file.
#
# The appliance resolves through the named it runs. That is not a convenience:
# a split-horizon resolver that answers a name one way for itself and another
# way for its clients is the one DNS fault nobody thinks to check, because
# every test run ON the server passes.
#
# No `search` line: the internal domain is site-specific and this image does
# not invent one. Add it here only by overriding the tmpfiles entry from
# /etc/tmpfiles.d/, or set it on the NetworkManager connection.
nameserver 127.0.0.1
options edns0 trust-ad
