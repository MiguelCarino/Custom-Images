# carino-offline — serve time to the LAN with nothing upstream reachable.
#
# This file is only read because config/purposes/offline.conf appends
# `confdir /etc/chrony.conf.d` to /etc/chrony.conf at build time, through
# POST_SCRIPT (/usr/libexec/carino-offline-chrony-confdir). The only include
# directive in Fedora's stock chrony.conf is `sourcedir /run/chrony-dhcp`,
# which takes source lines and nothing else, so there is no packaged drop-in
# path for the directives below. Verified against chrony in
# carino-layer-de-headless: no confdir line, no /etc/chrony.conf.d directory
# (the shipped file otherwise carries pool, driftfile, makestep, rtcsync,
# ntsdumpdir, leapseclist and logdir). `confdir` itself is
# documented in chrony.conf(5). If a Fedora chrony update ever reverts
# /etc/chrony.conf, re-run that script.

# THE line that makes this a time server instead of a time client.
#
# Without it, a chronyd with no reachable source never marks itself
# synchronised: it answers every NTP request with leap indicator 3, and every
# client on the LAN correctly rejects the answer. So the moment the WAN is
# cut, the whole building's clocks free-run — silently — and three weeks later
# TLS validation, TOTP, DICOM timestamps and log correlation start failing for
# reasons that look unrelated to the network outage that caused them. This is
# the single most underrated item on the offline plan's list, and it costs one
# directive.
#
# stratum 10 is high enough that any real reference, whenever one becomes
# reachable, wins on merit without anyone editing this file.
local stratum 10

# Who may ask. RFC1918 only, deliberately: a keystone that ends up on a public
# address is then not an NTP reflector. Narrow these to the actual VLANs if
# the site wants to; do not widen them.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16

# The reference. Uncomment ONE. Both are site-specific and neither is guessed
# here — a wrong device path is worse than none, because chronyd starts anyway.
#
# (a) GPS/PPS attached to THIS machine. gpsd is installed but not enabled.
#     Enable gpsd.service, and add GPSD_OPTIONS="-n" to /etc/sysconfig/gpsd
#     (Fedora's stock file sets only OPTIONS and USBAUTO) so gpsd polls the
#     receiver instead of waiting for a client: chrony's SHM refclock is not a
#     gpsd client, so the preset-enabled gpsd.socket never fires on its own and
#     the clock would never discipline while everything looked configured.
#     Do NOT mask gpsd.socket to force that — gpsd.service has
#     Requires=gpsd.socket and would then refuse to start at all.
#     Confirm a fix with cgps and pulses with ppstest before blaming chrony.
#refclock SHM 0 refid GPS
#refclock PPS /dev/pps0 lock GPS refid PPS
#
# (b) The GPS/PPS Pi from the plan's bill of materials as a network source.
#     This is the usual layout — the receiver is a separate board, not this
#     box. The address below is an illustration of the published VLAN plan,
#     not your network.
#server 10.20.0.10 iburst prefer minpoll 4 maxpoll 4
