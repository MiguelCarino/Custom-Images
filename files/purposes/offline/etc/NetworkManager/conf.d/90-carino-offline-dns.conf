# NetworkManager must not write /etc/resolv.conf on this image.
#
# systemd-resolved is masked here (see config/purposes/offline.conf). With it
# gone, NM falls back to composing and writing resolv.conf itself, and it would
# replace the symlink from /usr/lib/tmpfiles.d/carino-offline.conf with
# whatever DHCP handed the interface — i.e. the ISP's resolver, on the box
# whose entire job is to BE the LAN's resolver. It would do it at the first
# carrier event, long after anyone was watching.
#
#   dns=none             NM does not compose a resolv.conf at all
#   rc-manager=unmanaged NM does not touch the file or the symlink either
#
# DHCP-supplied nameservers are still recorded on the connection and readable
# with `nmcli dev show | grep DNS`, so they remain available as forwarders to
# paste into named.conf when there is a WAN. Nothing is lost, only unhooked
# from the file.
[main]
dns=none
rc-manager=unmanaged
