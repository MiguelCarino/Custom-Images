# =============================================================================
# Weasis DICOM configuration
# Place PACS AE titles and connection settings here.
# These values are read by Weasis on startup.
# =============================================================================

# Default DICOM node (override per-site in /etc/weasis/dicom-config.local.properties)
weasis.dicom.aetitle=WEASIS_WS
weasis.dicom.host=localhost
weasis.dicom.port=11112

# Supported transfer syntaxes
weasis.dicom.tsuid.list=\
  1.2.840.10008.1.2,\
  1.2.840.10008.1.2.1,\
  1.2.840.10008.1.2.4.70,\
  1.2.840.10008.1.2.4.80,\
  1.2.840.10008.1.2.4.81,\
  1.2.840.10008.1.2.4.90,\
  1.2.840.10008.1.2.4.91

# WADO / DICOMweb (set if your PACS exposes a DICOMweb endpoint)
# weasis.dicom.wado.url=http://pacs-server:8042/dicom-web

# Privacy: disable sending usage statistics
weasis.usage.statistics=false

# Logging level
weasis.log.level=INFO
