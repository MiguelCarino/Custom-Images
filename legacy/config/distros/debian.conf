# =============================================================================
# Distro config: Debian 13 (Trixie)
# Family: debian
# =============================================================================

DISTRO="debian"
DISTRO_FAMILY="debian"
DISTRO_VERSION="13"
DISTRO_DISPLAY="Debian 13 (Trixie)"

# Bootstrap: built locally from images/bootstrap/debian-13/Containerfile
BOOTSTRAP_CONTAINERFILE="images/bootstrap/debian-13/Containerfile"
BASE_IMAGE="localhost/debian-bootc:13"

# Package manager
PKG_UPDATE="apt-get update"
PKG_INSTALL="DEBIAN_FRONTEND=noninteractive apt-get install -y"
PKG_CLEAN="apt-get clean && rm -rf /var/lib/apt/lists/*"

# Extra repos: non-free + contrib for codecs and firmware
EXTRA_REPOS_BLOCK='RUN apt-get update \
    && DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common \
    && echo "deb http://deb.debian.org/debian trixie contrib non-free non-free-firmware" \
         >> /etc/apt/sources.list.d/non-free.list \
    && apt-get update \
    && apt-get clean && rm -rf /var/lib/apt/lists/*'

# Security model (AppArmor)
SECURITY_BLOCK='RUN systemctl enable apparmor || true'

FIREWALL_SERVICE="ufw"

WEASIS_PKG_NAME="weasis_\${WEASIS_VERSION}-1_amd64.deb"
WEASIS_INSTALL_CMD="dpkg -i"
