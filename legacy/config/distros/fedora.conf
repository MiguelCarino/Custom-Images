# =============================================================================
# Distro config: Fedora
# Family: rhel  (shared with RHEL, CentOS Stream, AlmaLinux)
# =============================================================================

DISTRO="fedora"
DISTRO_FAMILY="rhel"
DISTRO_VERSION="43"
DISTRO_DISPLAY="Fedora ${DISTRO_VERSION}"

# Official Fedora bootc base image
BASE_IMAGE="quay.io/fedora/fedora-bootc:${DISTRO_VERSION}"

# Package manager
PKG_INSTALL="dnf install -y"
PKG_CLEAN="dnf clean all"
PKG_COPR_ENABLE="dnf copr enable -y"

# Extra repos block (written verbatim into the Containerfile)
# RPM Fusion gives access to ffmpeg, codecs, and other non-free packages.
EXTRA_REPOS_BLOCK='RUN dnf install -y \
      "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
      "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm" \
    && dnf clean all'

# Security model
SECURITY_BLOCK='RUN sed -i '"'"'s/^SELINUX=.*/SELINUX=enforcing/'"'"' /etc/selinux/config'

# Firewall service
FIREWALL_SERVICE="firewalld"

# Weasis installer command for this family
WEASIS_PKG_SUFFIX="x86_64.rpm"
WEASIS_PKG_NAME="weasis-\${WEASIS_VERSION}-1.x86_64.rpm"
WEASIS_INSTALL_CMD="rpm -ivh"
