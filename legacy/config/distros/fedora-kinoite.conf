# =============================================================================
# Distro config: Fedora Kinoite (KDE Plasma Atomic Desktop)
# Family: rhel
# =============================================================================
# Kinoite base includes KDE Plasma, Flatpak/Flathub, RPM Fusion,
# fonts, multimedia codecs, and Wayland out of the box.
# =============================================================================

DISTRO="fedora-kinoite"
DISTRO_FAMILY="rhel"
DISTRO_VERSION="43"
DISTRO_DISPLAY="Fedora ${DISTRO_VERSION} Kinoite (KDE)"

BASE_IMAGE="quay.io/fedora/fedora-kinoite:${DISTRO_VERSION}"

PKG_INSTALL="dnf install -y"
PKG_CLEAN="dnf clean all"

EXTRA_REPOS_BLOCK='RUN dnf install -y \
      "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
      "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm" \
    && dnf clean all'

SECURITY_BLOCK='RUN sed -i '"'"'s/^SELINUX=.*/SELINUX=enforcing/'"'"' /etc/selinux/config'

FIREWALL_SERVICE="firewalld"

WEASIS_PKG_NAME="weasis-\${WEASIS_VERSION}-1.x86_64.rpm"
WEASIS_INSTALL_CMD="rpm -ivh"
