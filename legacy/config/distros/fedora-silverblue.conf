# =============================================================================
# Distro config: Fedora Silverblue (GNOME Atomic Desktop)
# Family: rhel
# =============================================================================
# Using Silverblue as the base means GNOME, Flatpak/Flathub, RPM Fusion,
# fonts, multimedia codecs, and Wayland are already included.
# Your custom image only needs to declare domain-specific packages and Flatpaks.
#
# Base image:  quay.io/fedora/fedora-silverblue:43
# KDE variant: use fedora-kinoite.conf instead
# =============================================================================

DISTRO="fedora-silverblue"
DISTRO_FAMILY="rhel"
DISTRO_VERSION="43"
DISTRO_DISPLAY="Fedora ${DISTRO_VERSION} Silverblue (GNOME)"

BASE_IMAGE="quay.io/fedora/fedora-silverblue:${DISTRO_VERSION}"

# Package manager (same as plain Fedora)
PKG_INSTALL="dnf install -y"
PKG_CLEAN="dnf clean all"

# Silverblue ships with RPM Fusion already available via a COPR-like mechanism.
# Enable it explicitly to be sure.
EXTRA_REPOS_BLOCK='RUN dnf install -y \
      "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
      "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm" \
    && dnf clean all'

# Security model
SECURITY_BLOCK='RUN sed -i '"'"'s/^SELINUX=.*/SELINUX=enforcing/'"'"' /etc/selinux/config'

FIREWALL_SERVICE="firewalld"

WEASIS_PKG_NAME="weasis-\${WEASIS_VERSION}-1.x86_64.rpm"
WEASIS_INSTALL_CMD="rpm -ivh"
