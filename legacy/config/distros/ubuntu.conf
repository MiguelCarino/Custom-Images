# =============================================================================
# Distro config: Ubuntu 24.04 LTS (Noble Numbat)
# Family: debian
# =============================================================================

DISTRO="ubuntu"
DISTRO_FAMILY="debian"
DISTRO_VERSION="24.04"
DISTRO_DISPLAY="Ubuntu 24.04 LTS"

# Bootstrap: built locally from images/bootstrap/ubuntu-24.04/Containerfile
# This avoids any dependency on external community images.
BOOTSTRAP_CONTAINERFILE="images/bootstrap/ubuntu-24.04/Containerfile"
BASE_IMAGE="localhost/ubuntu-bootc:24.04"

# Package manager
PKG_UPDATE="apt-get update"
PKG_INSTALL="DEBIAN_FRONTEND=noninteractive apt-get install -y"
PKG_CLEAN="apt-get clean && rm -rf /var/lib/apt/lists/*"

# Extra repos: universe + multiverse for codecs and extras
EXTRA_REPOS_BLOCK='RUN apt-get update \
    && DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common \
    && add-apt-repository -y universe \
    && add-apt-repository -y multiverse \
    && apt-get update \
    && apt-get clean && rm -rf /var/lib/apt/lists/*'

# Security model (AppArmor)
SECURITY_BLOCK='RUN systemctl enable apparmor || true'

# Firewall service
FIREWALL_SERVICE="ufw"

# Weasis installer for debian family
WEASIS_PKG_NAME="weasis_\${WEASIS_VERSION}-1_amd64.deb"
WEASIS_INSTALL_CMD="dpkg -i"
