# =============================================================================
# Profile: pacs-server
# Headless PACS server — inherits: base
# =============================================================================
# Orthanc is not packaged in any major distro for recent versions.
# It runs as a Podman quadlet (systemd-managed container) using the official
# docker.io/orthancteam/orthanc image.
# =============================================================================

PROFILE="pacs-server"
PROFILE_DESCRIPTION="PACS server: Orthanc (quadlet), PostgreSQL, Nginx"
INHERITS="base"

# ---- Packages ---------------------------------------------------------------

PKGS_rhel="\
  postgresql-server \
  postgresql \
  python3-psycopg2 \
  dcmtk \
  gdcm \
  gdcm-applications \
  podman \
  nginx \
  certbot \
  python3-certbot-nginx \
"

PKGS_debian="\
  postgresql \
  postgresql-client \
  python3-psycopg2 \
  dcmtk \
  gdcm-tools \
  podman \
  nginx \
  certbot \
  python3-certbot-nginx \
"

# ---- Services ---------------------------------------------------------------
SERVICES_rhel="postgresql nginx"
SERVICES_debian="postgresql nginx"

# ---- Orthanc quadlet container image ----------------------------------------
ORTHANC_IMAGE="docker.io/orthancteam/orthanc:latest"

# ---- PostgreSQL setup -------------------------------------------------------
PGSQL_INIT_rhel="postgresql-setup --initdb || true"
PGSQL_INIT_debian="pg_createcluster 15 main --start || true"

# ---- Storage directory -------------------------------------------------------
ORTHANC_STORAGE="/var/lib/orthanc"
