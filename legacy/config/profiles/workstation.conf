# =============================================================================
# Profile: workstation
# GNOME desktop — inherits: base
# =============================================================================

PROFILE="workstation"
PROFILE_DESCRIPTION="GNOME desktop with Flatpak, Podman, and multimedia codecs"
INHERITS="base"

# ---- Packages ---------------------------------------------------------------

PKGS_rhel="\
  @gnome-desktop \
  gnome-tweaks \
  gnome-extensions-app \
  gdm \
  xdg-user-dirs \
  xdg-utils \
  xorg-x11-server-Xwayland \
  google-noto-fonts-common \
  google-noto-sans-fonts \
  google-noto-serif-fonts \
  google-noto-emoji-fonts \
  google-noto-cjk-fonts \
  liberation-fonts \
  dejavu-fonts-all \
  bitstream-vera-fonts-all \
  ffmpeg \
  gstreamer1-plugins-base \
  gstreamer1-plugins-good \
  gstreamer1-plugins-bad-free \
  gstreamer1-plugins-ugly \
  gstreamer1-plugin-openh264 \
  pipewire \
  pipewire-pulseaudio \
  wireplumber \
  podman \
  buildah \
  skopeo \
  toolbox \
  distrobox \
  flatpak \
  cups \
  system-config-printer \
  sane-backends \
"

PKGS_debian="\
  gnome-shell \
  gnome-session \
  gnome-tweaks \
  gdm3 \
  xdg-user-dirs \
  xdg-utils \
  xwayland \
  fonts-noto \
  fonts-noto-cjk \
  fonts-liberation \
  fonts-dejavu-extra \
  ffmpeg \
  gstreamer1.0-plugins-base \
  gstreamer1.0-plugins-good \
  gstreamer1.0-plugins-bad \
  gstreamer1.0-plugins-ugly \
  gstreamer1.0-pipewire \
  pipewire \
  pipewire-pulse \
  wireplumber \
  podman \
  buildah \
  skopeo \
  flatpak \
  cups \
  system-config-printer \
  sane-utils \
"

# ---- Services ---------------------------------------------------------------
SERVICES_rhel="gdm cups"
SERVICES_debian="gdm3 cups"

# ---- Desktop target ---------------------------------------------------------
# Set graphical.target as default
GRAPHICAL_TARGET=true

# ---- Flatpak apps -----------------------------------------------------------
# Installed system-wide from Flathub.
# When using a Silverblue/Kinoite base these are the primary app delivery method.
# When using plain Fedora base these supplement the RPM packages above.
# Add or remove Flatpak app IDs here — one per line.
FLATPAKS="\
  org.gnome.Extensions \
  com.mattjakeman.ExtensionManager \
  org.gnome.FontManager \
"
