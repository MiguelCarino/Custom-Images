# =============================================================================
# Profile: medical
# Medical imaging workstation — inherits: workstation → base
# =============================================================================
# Included software:
#   Weasis        — DICOM viewer (RPM/DEB from GitHub OR Flatpak)
#   DCMTK         — DICOM toolkit CLI (C-STORE, C-FIND, C-MOVE, …)
#   GDCM          — Grassroots DICOM library + CLI
#   LibreOffice   — office suite (Flatpak — always up to date)
#   pydicom       — Python DICOM scripting
#   pynetdicom    — Python DICOM networking
#   SimpleITK     — medical image processing
#   nibabel       — neuroimaging file format library
#   itk           — Insight Toolkit (via pip)
# =============================================================================

PROFILE="medical"
PROFILE_DESCRIPTION="Medical imaging workstation: Weasis, DCMTK, LibreOffice"
INHERITS="workstation"

# ---- System packages (baked into the bootc image) ---------------------------
# Keep this list focused on tools that need deep system integration:
# DICOM networking, Python libraries, CLI tools.
# Desktop apps (LibreOffice, image editors) go in FLATPAKS below.

PKGS_rhel="\
  dcmtk \
  gdcm \
  gdcm-applications \
  python3-gdcm \
  python3-pydicom \
  python3-vtk \
  python3-pip \
  python3-numpy \
  python3-matplotlib \
  gnuplot \
  age \
  java-21-openjdk-headless \
"

PKGS_debian="\
  dcmtk \
  gdcm-tools \
  python3-gdcm \
  python3-pydicom \
  python3-vtk9 \
  python3-pip \
  python3-numpy \
  python3-matplotlib \
  gnuplot \
  age \
  openjdk-21-jre-headless \
"

# ---- Weasis -----------------------------------------------------------------
# Weasis is not in any distro repo; downloaded from GitHub releases.
# Version can be overridden: ./build.sh fedora medical --weasis-version 4.4.0
WEASIS_VERSION="4.3.0"

# ---- Flatpak apps -----------------------------------------------------------
# These are installed system-wide from Flathub and update independently of
# the OS image. When using Silverblue/Kinoite as the base, this is the
# preferred delivery method for desktop applications.
#
# To add an app: find its ID on https://flathub.org and append it here.
# To remove an app: delete its line.

FLATPAKS="\
  org.libreoffice.LibreOffice \
  org.inkscape.Inkscape \
  org.gnome.geeqie \
"
# NOTE: Weasis Flatpak is not yet on Flathub — installed via RPM/DEB above.
# If it becomes available: io.github.nroduit.Weasis

# ---- Python extras (pip — same on all distros) ------------------------------
PIP_PACKAGES="itk SimpleITK nibabel pynetdicom"

# ---- DICOM spool directory --------------------------------------------------
DICOM_SPOOL="/var/spool/dicom"

# ---- Distrobox guest containers ---------------------------------------------
# Named guest configs from config/guests/.
# The Fedora host image will:
#   1. Have distrobox installed
#   2. Pre-pull guest images via a systemd prefetch service
#   3. Provide a distrobox assemble config so users can create them in one command
#
# Leave empty to skip guest containers (Fedora-only deployment).
# Uncomment the lines below to enable Ubuntu/Debian app environments:
#
# DISTROBOX_GUESTS="\
#   ubuntu-24.04-medical \
#   debian-13-medical \
# "
DISTROBOX_GUESTS=""
