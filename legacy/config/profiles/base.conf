# =============================================================================
# Profile: base
# Minimal hardened OS — foundation for all other profiles
# =============================================================================

PROFILE="base"
PROFILE_DESCRIPTION="Minimal hardened base with SSH, firewall, and auto-updates"

# ---- Packages ---------------------------------------------------------------
# One space-separated list per distro family.
# To add a package: append it to the right family list.
# To remove a package: delete it from the list.

PKGS_rhel="\
  bootc \
  bash-completion \
  bind-utils \
  curl \
  wget \
  git \
  vim-enhanced \
  tmux \
  htop \
  rsync \
  unzip \
  tar \
  gzip \
  bzip2 \
  xz \
  NetworkManager \
  firewalld \
  openssh-server \
  policycoreutils-python-utils \
  audit \
  fwupd \
  usbutils \
  pciutils \
"

PKGS_debian="\
  bash-completion \
  bind9-utils \
  curl \
  wget \
  git \
  vim \
  tmux \
  htop \
  rsync \
  unzip \
  tar \
  gzip \
  bzip2 \
  xz-utils \
  network-manager \
  ufw \
  openssh-server \
  apparmor-utils \
  auditd \
  fwupd \
  usbutils \
  pciutils \
"

# ---- Services to enable at boot ---------------------------------------------
SERVICES_rhel="firewalld sshd auditd fwupd-refresh.timer bootc-fetch-apply-updates.timer"
SERVICES_debian="ssh auditd ufw fwupd-refresh.timer"
