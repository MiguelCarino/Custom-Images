# =============================================================================
# Guest container config: Ubuntu 24.04 medical imaging
# Used by build.sh when a profile declares this guest, and by generate.sh
# to write the Distrobox assemble config into the Fedora host image.
# =============================================================================

GUEST_NAME="ubuntu-medical"
GUEST_DESCRIPTION="Ubuntu 24.04 LTS — medical imaging (Weasis, DCMTK, LibreOffice)"
GUEST_CONTAINERFILE="images/app-containers/ubuntu-24.04-medical/Containerfile"

# Image tag built and pushed by build.sh
# On the deployed Fedora host, the systemd prefetch service pulls this.
GUEST_IMAGE_NAME="ubuntu-24.04-medical"

# Distrobox assemble options
GUEST_INIT=false          # don't run systemd inside the guest
GUEST_HOME_PREFIX=""      # share host home (default distrobox behaviour)
