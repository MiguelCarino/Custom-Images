# config/build.conf — global build defaults (plain bash, sourced).
# Override at invocation time with env vars or build.sh --registry/--tag flags.

FEDORA_VERSION=44
REGISTRY=localhost
TAG=latest
BASE_IMAGE="quay.io/fedora/fedora-bootc:${FEDORA_VERSION}"

# Root filesystem type for installer ISOs (bootc-image-builder --rootfs).
# fedora-bootc declares no default in the container, so one must be set here.
# Valid: ext4, xfs, btrfs.
ROOTFS=ext4
