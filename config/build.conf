# config/build.conf — global build defaults (plain bash, sourced).
# Override at invocation time with env vars or build.sh --registry/--tag flags.

FEDORA_VERSION=44
REGISTRY=localhost
TAG=latest
BASE_IMAGE="quay.io/fedora/fedora-bootc:${FEDORA_VERSION}"

# Root filesystem type for installer ISOs (bootc-image-builder --rootfs).
# fedora-bootc declares no default in the container, so one must be set here.
# Valid: ext4, xfs, btrfs.
ROOTFS=ext4

# First-boot account creation baked into the images (base layer, so the
# headless appliances carino-offline and carino-pbx get it too — see SCOPE.md
# §3, which records the move out of desktop-common):
#   interactive  Fedora initial-setup runs a text UI on the console before the
#                greeter on first boot, blocks until a user is created, then
#                disables itself (the Fedora IoT model).
#   none         ship no first-boot tool — bake credentials via config/iso.toml.
# Changing this changes image contents: re-run generate + build afterwards.
FIRSTBOOT=interactive
