# Purpose: security — network analysis and forensics.
# Starter set (ARCHITECTURE.md §11) from research/manifest-security.json.

PURPOSE="security"
DE="cosmic-hyprland"
PIN_REASON="no desktop automounter in the session, so removable evidence is never mounted on insertion"
DESCRIPTION="Security work: packet capture, recon, forensics, malware triage"

PACKAGES="wireshark tcpdump nmap aircrack-ng sleuthkit testdisk foremost binwalk yara radare2 python3-scapy lynis aide"

# First-boot flatpaks (§8) from research/manifest-security.json: Ghidra (JVM
# app with a version-sensitive JDK; far better sandboxed than unpacked into
# /opt on an immutable host), OWASP ZAP (add-on marketplace writes at
# runtime), Cutter (ships newer rizin than Fedora and can carry the rz-ghidra
# decompiler plugin). The Wireshark flatpak is deliberately NOT used — it
# cannot reach the host's capability-enabled dumpcap, so live capture breaks;
# the RPM above is the real thing.
FLATPAKS="org.ghidra_sre.Ghidra org.zaproxy.ZAP re.rizin.cutter"
