# Purpose: pbx — telephony appliance (Asterisk + FreePBX 17).
# Package set verified against live Fedora 44 repos + Remi F44 on 2026-08-06;
# reasoning and every rejected alternative are in research/manifest-pbx.json.
#
# This is the first purpose that is an APPLIANCE rather than a workstation, and
# the first pinned to the headless session (config/layers/de/headless.conf), so
# three things differ from the other images:
#
#  1. No desktop branch at all — the chain is base → de/headless → pbx, which
#     also means no first-boot Flatpak mechanism (ARCHITECTURE.md §8). Every
#     component here is an RPM or is installed by freepbx-setup at first boot.
#  2. It exceeds the §11 starter-set size (roughly 5–15 packages) on purpose.
#     For a workstation the package list is a starting point a user builds on;
#     for an appliance the package list IS the product, and a PBX missing its
#     database or its PHP runtime is not a smaller PBX, it is a broken one.
#  3. FreePBX itself is NOT an RPM — see the REPO_RPMS note below and
#     files/purposes/pbx/usr/libexec/freepbx-setup.

PURPOSE="pbx"
DE="headless"
PIN_REASON="an appliance administered over the network: the interfaces are the web UI and SSH, so a desktop would only add attack surface, RAM and packages to patch"
DESCRIPTION="Telephony appliance: Asterisk 18 with the FreePBX 17 web UI, MariaDB, Apache, PHP 8.2"

# PHP 8.2, and only 8.2. FreePBX 17 requires it and upstream states plainly
# that 8.3+ must not be installed — modules are not compatible. Fedora 44
# ships PHP 8.5, so the runtime cannot come from Fedora, and this is the one
# thing on the image with no in-Fedora substitute.
# Remi's SCL packages solve it exactly: php82-php-* installs under
# /opt/remi/php82 as a *parallel* runtime, so Fedora's own PHP stack is
# neither replaced nor shadowed, and only the FreePBX pool and fwconsole ever
# see 8.2. Verified 2026-08-06 (SCOPE.md §7.2 rule — external identifiers get
# checked, not assumed): remi-release-44 installs, and its repo serves
# php82-php-* 8.2.33-1.fc44.remi.
REPO_RPMS="https://rpms.remirepo.net/fedora/remi-release-${FEDORA_VERSION}.rpm"

# Asterisk 18.26.4 is what Fedora 44 carries, and it is a combination FreePBX
# 17 supports (framework 17.0.19.1 lists Asterisk 18 => 18.24.1 as a supported
# floor). Fedora's build is used rather than a source build so security
# updates arrive through `bootc upgrade` like everything else on the image.
# pjsip is the modern channel driver FreePBX defaults to; chan_sip is EOL
# upstream and deliberately not installed.
PACKAGES="asterisk asterisk-pjsip asterisk-odbc asterisk-voicemail asterisk-curl asterisk-fax asterisk-sounds-core-en-ulaw asterisk-sounds-core-en-g722 \
mariadb-server mariadb unixODBC mysql-connector-odbc \
httpd mod_ssl \
php82-php-cli php82-php-fpm php82-php-mysqlnd php82-php-mbstring php82-php-xml php82-php-gd php82-php-intl php82-php-bcmath php82-php-process php82-php-sodium php82-php-pecl-zip php82-php-opcache php82-php-pear php82-php-ldap \
nodejs22 nodejs22-npm sox mpg123 lame \
fail2ban fail2ban-firewalld sngrep tcpdump tftp-server tar"

# freepbx-setup.service does the first-boot install (unit + script in
# files/purposes/pbx/). freepbx.service is NOT enabled here: it runs
# `fwconsole start`, which does not exist until that install has finished, so
# the setup script enables it as its last step.
# php82-php-fpm and httpd serve the UI; mariadb holds the FreePBX databases.
SERVICES_ENABLE="freepbx-setup.service mariadb.service httpd.service php82-php-fpm.service fail2ban.service"

# Asterisk is started and stopped by FreePBX (`fwconsole start`), never by
# systemd. Leaving Fedora's asterisk.service enabled would give the process
# two supervisors — the classic failure of running FreePBX on top of a distro
# Asterisk package: systemd starts Asterisk with the packaged config, fwconsole
# starts a second one with the FreePBX config, and the first to grab the
# control socket wins. Masking is the only way to make that impossible.
SERVICES_MASK="asterisk.service"
