# Purpose: music — DAW / pro-audio workstation.
# Starter set (ARCHITECTURE.md §11) from research/manifest-music.json.
# KARGS + SERVICES_MASK wire the §11 integration examples end to end.

PURPOSE="music"
DE="cosmic-hyprland"
PIN_REASON="no file indexer; lowest overhead"
DESCRIPTION="Music production: DAWs, plugin suites, low-latency audio tuning"

PACKAGES="ardour9 qtractor hydrogen Carla qpwgraph lsp-plugins-lv2 lv2-x42-plugins fluidsynth fluid-soundfont-gm realtime-setup rtkit tuned rt-tests"

SERVICES_ENABLE="tuned.service"

# §11 integration examples: threaded IRQs for low-latency audio, and silence
# the inherited power daemon (conflicts with tuned's latency profile).
KARGS="threadirqs"
SERVICES_MASK="power-profiles-daemon.service"
