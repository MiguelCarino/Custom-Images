# Purpose: gaming — gaming desktop.
# Starter set (ARCHITECTURE.md §11) from research/manifest-gaming.json
# (Fedora-repo names only; RPM Fusion pieces like steam land in the package
# phase). KARGS wires the §11 integration example end to end.

PURPOSE="gaming"
DE="cosmic-hyprland"
PIN_REASON="tearing control + bakeable per-output VRR"
DESCRIPTION="Gaming: gamescope, mangohud, gamemode, wine, input tooling"

PACKAGES="steam-devices lutris gamescope mangohud gamemode wine winetricks antimicrox solaar libratbag-ratbagd nvtop radeontop vulkan-tools mpv htop fastfetch"

SERVICES_ENABLE="ratbagd.service"

# §11 integration example: avoid split-lock throttling stutter in games.
KARGS="split_lock_detect=off"

# First-boot flatpaks (§8) from research/manifest-gaming.json: ProtonUp-Qt
# (Flathub channel over the personal COPRs), Heroic, Flatpak Steam
# (steam-devices stays in PACKAGES above for controller udev rules), and the
# emulator set: PCSX2 (mandatory over the 1.6.0 RPM Fusion package), RPCS3,
# DuckStation, PPSSPP, melonDS, Azahar (Citra successor), xemu, Flycast, Cemu.
# NOT listed: the Steam sandbox extensions (org.freedesktop.Platform.
# VulkanLayer.MangoHud/.vkBasalt/.gamescope) — they publish multiple runtime
# branches, and `flatpak install --noninteractive` cannot pick one, so the
# first-boot installer would fail; Steam pulls the matching branches itself.
FLATPAKS="net.davidotek.pupgui2 com.heroicgameslauncher.hgl com.valvesoftware.Steam net.pcsx2.PCSX2 net.rpcs3.RPCS3 org.duckstation.DuckStation org.ppsspp.PPSSPP net.kuribo64.melonDS io.github.azahar_emu.Azahar app.xemu.xemu org.flycast.Flycast info.cemu.Cemu"
