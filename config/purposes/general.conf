# Purpose: general — everyday desktop.
# Starter set (ARCHITECTURE.md §11) from research/manifest-general.json.
# DE-agnostic apps only (research/audit-layering.md — purpose layers must not
# embed DE packages). GAP: an archiver, a calculator and a scanning front end
# (file-roller, gnome-calculator, simple-scan) used to live in the de/gnome
# layer, which was removed when every purpose moved to COSMIC + Hyprland.
# Nothing pulls them now and COSMIC ships no equivalent, so the package phase
# (§11) has to place them — here if DE-agnostic, else in the DE layer.

PURPOSE="general"
DE="cosmic-hyprland"
PIN_REASON="single supported session: COSMIC for pointer-driven use, Hyprland when tiling is wanted"
DESCRIPTION="General-purpose desktop: browsing, mail, office, media"

PACKAGES="firefox thunderbird libreoffice-writer libreoffice-calc libreoffice-impress mpv keepassxc transmission-gtk yt-dlp"
