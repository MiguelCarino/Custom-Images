# Purpose: llms — local LLM inference workstation.
# Starter set (ARCHITECTURE.md §11) from research/manifest-llms.json.

PURPOSE="llms"
DE="cosmic-hyprland"
PIN_REASON="leanest session; least VRAM held by the desktop"
DESCRIPTION="Local LLMs: ollama, llama.cpp, whisper.cpp, Python tooling"

PACKAGES="ollama llama-cpp whisper-cpp ramalama python3-huggingface-hub uv pipx git-lfs numactl nvtop radeontop"

SERVICES_ENABLE="ollama.service"

# First-boot flatpaks (§8) from research/manifest-llms.json: GUI frontends
# iterate weekly and have no system-integration needs, so they stay out of the
# image — Alpaca talks to host ollama over 127.0.0.1:11434 (allowed by its
# default --share=network), Podman Desktop manages the vLLM/open-webui
# containers this purpose leans on. The inference/acceleration path itself
# must stay native: ROCm/CUDA userspace has to match the host kernel module.
FLATPAKS="com.jeffser.Alpaca io.podman_desktop.PodmanDesktop"
