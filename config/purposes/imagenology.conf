# Purpose: imagenology — medical imaging workstation.
# Starter set (ARCHITECTURE.md §11) from research/manifest-imagenology.json.

PURPOSE="imagenology"
DE="cosmic-hyprland"
PIN_REASON="single supported session; calibration is applied per-display with ArgyllCMS, not by the desktop"
DESCRIPTION="Medical imaging: DICOM toolchain, scientific Python, display calibration"

PACKAGES="dcmtk gdcm gdcm-applications python3-pydicom python3-pynetdicom dcm2niix python3-nibabel python3-numpy python3-scipy python3-matplotlib argyllcms colord-extra-profiles"

# First-boot flatpaks (§8) from research/manifest-imagenology.json: Weasis,
# Aliza MS and InVesalius (closes those rows in
# tools/purpose-apps/imagenology.apps; only xmedcon remains a deliberate
# check-drift violation until the package phase), plus ARX for research-export
# de-identification. DisplayCAL is deliberately NOT flatpak'd — it needs raw
# USB colorimeter access and drives the host ArgyllCMS, so it stays an RPM
# concern.
FLATPAKS="io.github.nroduit.Weasis com.github.AlizaMedicalImaging.AlizaMS br.gov.cti.invesalius org.deidentifier.arx"
