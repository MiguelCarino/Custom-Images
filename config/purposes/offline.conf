# Purpose: offline — intranet keystone appliance.
# Package set verified against live Fedora 44 repos on 2026-08-15; reasoning
# and every rejected capability are in research/manifest-offline.json.
#
# This is the second APPLIANCE in the catalog and the second purpose pinned to
# the headless session (config/layers/de/headless.conf), so it inherits the
# same three consequences carino-pbx documents: the chain is
# base → de/headless → offline, there is no desktop, and there is NO
# first-boot Flatpak mechanism (ARCHITECTURE.md §8) — everything is an RPM or
# is installed by a unit this image ships. There is no FLATPAKS line below for
# that reason, not by oversight: the installer lives in desktop-common, which
# this chain never touches, so a Flatpak listed here would be written to a
# list nothing on the machine ever reads.
#
# Why it is an image and not a Carino Setup package list (SCOPE.md §2). Five
# decisions here are system integration a post-install script cannot own:
#
#  1. systemd-resolved has to stop being this box's resolution path, and it
#     is installed AND preset-enabled on the bootc base (verified in the built
#     carino-layer-de-headless image: rpm -q systemd-resolved returns 259.7,
#     systemctl is-enabled returns 'enabled', and `enable
#     systemd-resolved.service` appears in both 90-default.preset and
#     90-systemd.preset — so `systemctl disable` does not survive a preset
#     re-run and masking does).
#  2. /etc/resolv.conf on that same base is a symlink to
#     ../run/systemd/resolve/stub-resolv.conf. Mask resolved without
#     re-owning that path and the appliance has no resolver at all — the
#     arbitration has to be in the image, not in a script that runs after the
#     machine is already unable to resolve the name of the script's source.
#  3. An internal CA has to have a place in the trust store where a site root
#     actually lands, with update-ca-trust run where it takes effect.
#  4. dnf has to be pointable at a LAN mirror without deadlocking the box's
#     own package tooling on a hostname that may not resolve.
#  5. chrony (inherited from de/headless) has to keep serving time with
#     nothing upstream reachable, which takes one directive nothing installs
#     for you and whose absence is silent for weeks.
#
# It exceeds the ARCHITECTURE.md §11 starter-set size for the same reason
# carino-pbx does: for a workstation the package list is a starting point a
# user builds on; for an appliance the package list IS the product, and a
# keystone that cannot sign a zone or verify a disc is not a smaller keystone,
# it is a broken one. It is 18 packages — the appliance order of magnitude,
# not a catalogue. Everything whose only justification was 'it is a package'
# was rejected; see research/manifest-offline.json.
#
# The 'why' behind this image is written up at https://offline.carino.systems/
# (section 00 - Start), and that page points back here. Neither document is
# the other's summary: the site is the plan, this is one box in it.

PURPOSE="offline"
DE="headless"
PIN_REASON="an appliance that has to answer on the LAN's own ports before anything else on the network is up: DNS, NTP and HTTP are its interfaces and SSH is its console, so a desktop would only add attack surface, RAM and packages to patch to the one box the network cannot lose"
DESCRIPTION="Intranet keystone appliance: authoritative and recursive DNS, LAN time, internal-CA trust store, an RPM mirror and offline content over HTTP, and the sneakernet media pipeline"

# DNS. bind is the only stable-branch package in Fedora 44 that is
# authoritative and recursive in one process, which is what split-horizon
# needs: `view` clauses matched on client address, so retina.carino.systems
# answers with a LAN address inside the building and a public one outside.
# unbound's auth-zone is
# a mirror, not an authority; knot + knot-resolver would be two daemons
# contending for one port. Fedora's own /etc/named.conf is deliberately left
# in place — it comes up listening on 127.0.0.1 only, which is exactly what
# this image's resolv.conf points at, so the box resolves for itself on first
# boot and serving the LAN stays an explicit edit against the example in
# /usr/share/carino-offline/. bind-utils is separate from bind and dig is how
# every DNS complaint gets diagnosed on a machine with no desktop.
# bind-dnssec-utils signs the internal zone, which is the only DNSSEC that
# still works when the WAN is gone: a public chain needs reachable parents, an
# internal one needs a key here and the anchor on the printed card.
#
# The version is a trade, recorded rather than glossed. Fedora 44 ships bind
# 9.18.50, and ISC announced on 2026-06-10 that this exact release is the last
# maintenance version of 9.18 and that the branch reached end of life on
# 2026-06-17, with the advice to move to 9.20. Fedora 44 has no 9.20 (verified
# with dnf repoquery); the only other name is bind9-next 9.21.22, which is
# ISC's development branch and not a stable one. So the keystone runs an
# end-of-life stable release and gets whatever Fedora backports — which weighs
# more here than elsewhere, because an appliance whose updates arrive by rsync
# or by courier cannot pull an out-of-band fix quickly.
#
# HTTP. caddy is the single front for the mirror tree, the Fleet Offline
# Edition sites and a reverse proxy to kiwix-serve. Its RPM ships
# /etc/caddy/Caddyfile.d and the stock Caddyfile ends with
# `import Caddyfile.d/*.caddyfile` (verified by unpacking the RPM), so adding
# a service is a drop-in and a reload. It also embeds smallstep's CA —
# `tls internal` and `acme_server` — which is the nearest thing in Fedora to
# the step-ca in the plan, since step-ca is NOT PACKAGED (verified: repoquery
# returns nothing for step-ca or step-cli). Note caddy.service runs
# `caddy validate` as ExecStartPre: a bad drop-in stops the web server rather
# than degrading it, which is why the shipped example carries a .example
# extension the import glob does not match.
#
# kiwix-tools ships kiwix-serve and NO systemd unit (verified), and its
# default port is 80 (verified in kiwix-serve(1)) — left alone it collides
# with caddy. The image supplies the unit, binds it to 127.0.0.1:8080 and
# gates it on the ZIM library existing.
#
# Time. chronyd is already enabled by de/headless; what is missing is a
# reference and permission to serve, and both are configuration. gpsd is
# shipped but NOT enabled: the receiver is site hardware and the plan's bill
# of materials puts it on a separate Pi, so the usual deployment takes that Pi
# as a network source. It is here anyway because plugging a USB GPS into the
# keystone on a single-box install must not require rebuilding the image on a
# machine with no internet. pps-tools and gpsd-clients exist so that 'the
# clock is not disciplining' has three suspects and a way to eliminate two.
#
# Packages. dnf5-plugins, not dnf-plugins-core: Fedora 44's dnf is dnf5 and
# reposync/repoclosure ship as dnf5 plugin objects here (verified —
# /usr/lib64/dnf5/plugins/reposync_cmd_plugin.so). The dnf4 package resolves
# cleanly and then does not provide the commands, which is worse than a name
# that fails. createrepo_c turns a hand-curated or sneakernet-delivered
# directory into something a client can install from. rsync is genuinely
# absent from the base (verified: rpm -q rsync says not installed).
#
# Trust. easy-rsa issues certificates for the things Caddy will not — a
# printer, a switch, the PACS box. It is deliberately not initialised at build
# time: a CA private key baked into an image is the same key on every install,
# which is not a CA, it is a published key.
#
# Sneakernet. xorriso authors, burns and reads back in one tool (and already
# provides the mkisofs and cdrecord names, so the legacy packages would be a
# second implementation behind one command). par2cmdline is the 10% PAR2 step
# the standard disc build puts on every disc without exception — rot takes out
# sectors, and a checksum tells you the disc is bad while PAR2 gives the data
# back. isomd5sum puts the checksum INSIDE the image so a burned disc or a
# dd'd USB stick can be verified from the device, which a SHA256SUMS file at
# the root cannot do and which is the file most likely to be lost in transit.
# udftools writes the UDF filesystem — caveat recorded honestly: mkudffs(8) in
# this build accepts --udfrev 2.60 but marks everything above 2.01
# experimental, so 'UDF 2.60 for BD' is a read-back test on the real burner,
# not a setting to copy in. dvd+rw-mediainfo is the first command run when a
# burn fails on a drive bought years earlier as a cold spare.
#
# tcpdump, same reasoning as carino-pbx: this box's whole product is answering
# on 53 and 123, and the only way to settle whether the query arrived is to
# watch the wire.
PACKAGES="bind bind-utils bind-dnssec-utils \
caddy kiwix-tools \
gpsd gpsd-clients pps-tools \
createrepo_c dnf5-plugins rsync \
easy-rsa \
xorriso udftools dvd+rw-tools par2cmdline isomd5sum \
tcpdump"

# chrony has no packaged drop-in directory. Verified in the built
# carino-layer-de-headless image: the only include directive in
# /etc/chrony.conf is `sourcedir /run/chrony-dhcp`, which takes source lines
# only (the rest of the file is pool, driftfile, makestep, rtcsync,
# ntsdumpdir, leapseclist and logdir — note the `pool
# 2.fedora.pool.ntp.org iburst` that will never resolve on this appliance),
# and neither /etc/chrony.conf.d nor /etc/chrony/sources.d exists. `confdir`
# is a documented chrony.conf(5) directive, so one line has to be appended to
# Fedora's config for etc/chrony.conf.d/10-carino-offline.conf to be read at
# all. Without it that file is inert and the appliance stops serving time the
# moment its last source goes away — silently, which is the whole problem.
#
# POST_SCRIPT is a path relative to this purpose's files dir, not an inline
# command (lib/generate.sh COPYs it to /tmp/post.sh and runs it). It is placed
# under usr/libexec/ rather than at the root of the files tree so that the
# COPY of the files dir lands it somewhere legitimate on the image, where it
# can be re-run by hand after a chrony update reverts the edit.
POST_SCRIPT="usr/libexec/carino-offline-chrony-confdir"

# named starts with Fedora's stock config: a validating recursive resolver on
# 127.0.0.1, which is what this image's /etc/resolv.conf points at, so the
# appliance can resolve for itself from the first boot even though it serves
# nothing to the LAN until someone writes the zone.
# caddy starts on the packaged Caddyfile, which serves a welcome page on :80.
# That is deliberate: port 80 answering proves the HTTP path end to end before
# any content exists, and the real sites arrive as Caddyfile.d drop-ins.
# kiwix-serve.service ships in this image's files/ tree and carries
# ConditionPathExists=/var/lib/kiwix/library.xml, so it is enabled but inert
# until ZIM files actually arrive — the same shape as freepbx.service on
# carino-pbx, and for the same reason: a unit that fails on every boot of a
# correctly-built machine trains people to ignore failed units.
# carino-offline-firstboot.service opens dns/http/https/ntp in the default
# zone and runs `update-ca-trust extract`, then stamps.
# sshd, firewalld and chronyd are enabled by de/headless, not here.
# gpsd.service is NOT enabled: no receiver is present at build time.
SERVICES_ENABLE="named.service caddy.service kiwix-serve.service carino-offline-firstboot.service"

# systemd-resolved must not exist on a box whose product is DNS, and disabling
# it is not enough. Verified in the built carino-layer-de-headless image:
# systemd-resolved 259.7 is installed, is enabled, and
# `enable systemd-resolved.service` appears in BOTH
# /usr/lib/systemd/system-preset/90-default.preset and 90-systemd.preset — so
# any `systemctl preset-all`, and any future package touching presets, turns
# it back on.
#
# The reason that actually decides it is not a port collision — resolved's
# stub holds 127.0.0.53:53 and 127.0.0.54:53 (resolved.conf(5), and
# DNSStubListenerExtra defaults to unset), while Fedora's stock named.conf
# binds `listen-on port 53 { 127.0.0.1; }` explicitly, so the two coexist and
# named does not fail at boot. A collision only appears if someone writes
# `listen-on { any; }`, which no file this image ships suggests. What decides
# it is nsswitch.conf: `hosts: files myhostname resolve [!UNAVAIL=return] dns`
# (verified in the parent layer), so while resolved runs it is this host's
# resolution path through nss-resolve, and the appliance keeps a second cache
# populated from whatever DHCP handed it, which can answer an internal name
# differently from the answer this same machine is giving the rest of the
# building. A split-horizon resolver that disagrees with itself is the one DNS
# fault nobody thinks to look for.
#
# The alternative usually recommended, DNSStubListener=no, is the right answer
# on a WORKSTATION running a local resolver and the wrong one here for exactly
# that reason: it silences the stub and leaves the daemon as the resolution
# path. Masking gives one daemon, one cache, one answer.
#
# The two resolved socket units are masked with it. Verified in the built
# carino-layer-de-headless image: systemd-resolved-varlink.socket and
# systemd-resolved-monitor.socket both report is-enabled 'enabled', and
# systemd-resolved.service carries Sockets= and Also= naming both. Masking
# only the service leaves the varlink socket listening, so every nss-resolve
# lookup tries to activate a masked unit — resolution still succeeds, because
# [!UNAVAIL=return] falls through to the dns module, but the DNS appliance
# boots with an activation path that fails on use. That is the same
# 'failed units people learn to ignore' problem kiwix-serve's
# ConditionPathExists exists to avoid, on the box where it matters most.
#
# gpsd.socket is NOT masked, deliberately, and the reason is worth writing
# down because the obvious move is wrong. Fedora's 90-default.preset line 207
# reads `enable gpsd.socket` (verified), so merely installing gpsd arms socket
# activation — and chrony's SHM refclock is not a gpsd client, so the socket
# never fires, gpsd never runs, and the clock never disciplines while
# everything reports as configured. But masking the socket does not fix that:
# Fedora's gpsd.service opens `Requires=gpsd.socket` (verified by unpacking
# gpsd-1:3.27.5-5.fc44), and systemd refuses to queue a job whose Requires=
# is masked, so `systemctl start gpsd.service` would fail outright — on the
# single-box install this package exists for. The socket is left alone and the
# answer is operational instead: enable gpsd.service, and put
# GPSD_OPTIONS="-n" in /etc/sysconfig/gpsd so gpsd polls the receiver without
# waiting for a client. Fedora's stock /etc/sysconfig/gpsd sets only OPTIONS
# and USBAUTO (verified), so GPSD_OPTIONS has to be added by hand; the shipped
# /etc/chrony.conf.d/10-carino-offline.conf says so next to the refclock lines.
#
# Masking a unit whose package is not installed is harmless (systemctl writes
# the /dev/null symlink either way), so this is stable whether or not a future
# base image drops systemd-resolved.
SERVICES_MASK="systemd-resolved.service systemd-resolved-varlink.socket systemd-resolved-monitor.socket"
