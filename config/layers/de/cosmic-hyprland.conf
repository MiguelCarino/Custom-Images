# Layer: de/cosmic-hyprland — COSMIC + Hyprland sessions.
# Starter set (ARCHITECTURE.md §11) from research/manifest-de-cosmic-hyprland.json:
# the core COSMIC set (the research explicitly recommends listing cosmic-*
# packages instead of the thin/incomplete @cosmic-desktop group — the group
# omits cosmic-greeter/cosmic-settings/cosmic-panel) plus the core Hyprland
# set and its Fedora-repo support tools.
# cosmic-greeter is THE greeter for both sessions (it enumerates
# /usr/share/wayland-sessions, so it launches Hyprland too).
#
# COPR EXCEPTION (sanctioned deviation from the §11 "repo-verified packages
# only" rule): hyprland and xdg-desktop-portal-hyprland are absent from
# Fedora 44 + RPM Fusion (verified in the manifest's "unavailable" list) and
# have NO in-Fedora substitute — the session cannot exist without them, so
# they come from lionheartp/Hyprland, which the research manifest leans toward
# (it is what the Fedora 44 research host actually runs) and whose own
# description says it is forked from solopasha/hyprland.
# Verified 2026-07-27 per SCOPE.md §7.2: the project exists with fedora-44
# x86_64 + aarch64 chroots, and the snapshot trap the manifest warned about is
# NOT live — in a fedora container `hyprland` resolves to stable 0.56.0-1.fc44,
# nothing other than hyprland Provides hyprland, and hyprland-git obsoletes only
# the old -aquamarine-git/-nvidia-git renames. The repo still tracks upstream
# aggressively, so pin it (versionlock or dated snapshot) in the package phase.
# The optional Hyprland helpers use the manifest's in-Fedora substitutes
# instead of their COPR counterparts, minimizing COPR surface:
#   swaylock (not hyprlock), swayidle (not hypridle), swaybg (not hyprpaper).

LAYER="de/cosmic-hyprland"
DESCRIPTION="COSMIC desktop plus Hyprland tiling session, greeted by cosmic-greeter"
PARENT="desktop-common"

COPRS="lionheartp/Hyprland"

PACKAGES="cosmic-session cosmic-comp cosmic-greeter greetd cosmic-settings cosmic-panel cosmic-applets cosmic-launcher cosmic-files cosmic-term cosmic-icon-theme xdg-desktop-portal-cosmic hyprland xdg-desktop-portal-hyprland swaylock swayidle swaybg waybar fuzzel mako grim slurp foot mate-polkit gnome-keyring xorg-x11-server-Xwayland qt6-qtwayland"

# First-login personalization wizard (XDG autostart, runs once per user in the
# COSMIC session). NOT the account creator — that is initial-setup in
# desktop-common. Verified 2026-07-27: cosmic-initial-setup 1.4.0 in Fedora 44
# updates; ships only /etc/xdg/autostart + polkit rules, no systemd unit.
PACKAGES+=" cosmic-initial-setup"

# cosmic-greeter aliases display-manager.service; never also enable greetd/gdm.
SERVICES_ENABLE="cosmic-greeter.service"
