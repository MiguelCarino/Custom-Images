# Layer: de/headless — the session with no desktop.
#
# It lives under config/layers/de/ because a purpose's parent is derived from
# its DE pin (`PARENT="de/${DE}"`, lib/common.sh), so a purpose that must not
# have a desktop pins DE="headless". The field still means "the session this
# purpose is pinned to"; here the session is the console, plus SSH.
#
# PARENT is base, NOT desktop-common: a server has no use for PipeWire,
# portals, Flatpak, fonts, Mesa or a browser, and every one of those is
# attack surface and RAM on an appliance. That also means the first-boot
# Flatpak mechanism (ARCHITECTURE.md §8) does not exist on this branch —
# purposes pinned here must deliver everything as RPMs.
#
# initial-setup (first-boot account creation) is inherited from base, where it
# was moved for exactly this reason: an image on this branch has no greeter,
# so the console text UI is the only way the first account gets made.

LAYER="de/headless"
DESCRIPTION="Headless server session: console and SSH, no desktop stack at all"
PARENT="base"

# Starter set (ARCHITECTURE.md §11), all verified present in Fedora 44
# (2026-08-06). Deliberately not here: nftables (firewalld owns the backend
# and pulls it), rsyslog (the journal is the log store on an image-based
# system, and a second copy of every line is not free).
PACKAGES="openssh-server firewalld chrony cronie logrotate tuned policycoreutils-python-utils bash-completion tmux"

# sshd is the only administrative path into a machine with no desktop, so it
# is enabled here rather than left to each purpose. firewalld starts with the
# default zone, which permits ssh and nothing else; purposes open their own
# ports. chronyd matters more than usual on this branch: telephony, TLS and
# log correlation all break in confusing ways when the clock drifts.
SERVICES_ENABLE="sshd.service firewalld.service chronyd.service"
