# Layer: desktop-common — DE-agnostic desktop infrastructure.
# Starter set (ARCHITECTURE.md §11) from research/manifest-desktop-common.json.
# Also ships the first-boot flatpak mechanism (§8) via files/desktop-common/:
# flatpak-setup.service + /usr/libexec/flatpak-setup, enabled here.

LAYER="desktop-common"
DESCRIPTION="DE-agnostic desktop infrastructure: audio, portals, flatpak, fonts, browser"
PARENT="base"

PACKAGES="pipewire wireplumber pipewire-alsa pipewire-pulseaudio xdg-desktop-portal xdg-desktop-portal-gtk flatpak fontconfig default-fonts-core-sans mesa-dri-drivers mesa-vulkan-drivers adwaita-icon-theme xdg-user-dirs power-profiles-daemon wl-clipboard"

# Firefox lives here, not in the purpose layers: every image gets a browser,
# and defining it once keeps it out of each purpose's conf. Delivered as a
# first-boot flatpak (§8) rather than an RPM so it updates on Mozilla's
# cadence instead of the image rebase cadence.
FLATPAKS="org.mozilla.firefox"

# First-boot flatpak installer (unit + script live in files/desktop-common/).
SERVICES_ENABLE="flatpak-setup.service"

# First-boot account creation (FIRSTBOOT in config/build.conf, default
# interactive): Fedora initial-setup runs a text UI on the console before the
# greeter (Before=display-manager.service), blocks until a user is created,
# then disables itself — the Fedora IoT model for ostree/bootc images.
# cosmic-initial-setup cannot do this job: it is an XDG autostart app inside
# an already-logged-in session, so with zero users it never runs.
# Verified 2026-07-27 in a fedora:44 container: initial-setup 0.3.101 ships
# initial-setup.service; text UI needs only anaconda-tui + python3-simpleline.
if [[ "${FIRSTBOOT:-interactive}" == "interactive" ]]; then
  PACKAGES+=" initial-setup"
  SERVICES_ENABLE+=" initial-setup.service"
fi
