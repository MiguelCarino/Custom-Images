# Layer: desktop-common — DE-agnostic desktop infrastructure.
# Starter set (ARCHITECTURE.md §11) from research/manifest-desktop-common.json.
# Also ships the first-boot flatpak mechanism (§8) via files/desktop-common/:
# flatpak-setup.service + /usr/libexec/flatpak-setup, enabled here.

LAYER="desktop-common"
DESCRIPTION="DE-agnostic desktop infrastructure: audio, portals, flatpak, fonts"
PARENT="base"

PACKAGES="pipewire wireplumber pipewire-alsa pipewire-pulseaudio xdg-desktop-portal xdg-desktop-portal-gtk flatpak fontconfig default-fonts-core-sans mesa-dri-drivers mesa-vulkan-drivers adwaita-icon-theme xdg-user-dirs power-profiles-daemon wl-clipboard"

# First-boot flatpak installer (unit + script live in files/desktop-common/).
SERVICES_ENABLE="flatpak-setup.service"
