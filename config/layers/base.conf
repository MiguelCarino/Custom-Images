# Layer: base — root of every chain; builds FROM ${BASE_IMAGE}.
# Starter package set only (ARCHITECTURE.md §11); full hardening lands in the
# package phase. Names drawn from research/manifest-*.json verified sets.

LAYER="base"
DESCRIPTION="Common base: CLI quality-of-life tools shared by every image"
PARENT=""

PACKAGES="nano vim-enhanced jq zstd unzip gnupg2 smartmontools lsof"

# First-boot account creation (FIRSTBOOT in config/build.conf, default
# interactive): Fedora initial-setup runs a text UI on the console before any
# greeter on first boot, blocks until a user is created, then disables itself
# — the Fedora IoT model for ostree/bootc images. The bootc base images ship
# no accounts and the unattended installer creates none, so without this an
# installed system has no way in.
# Verified 2026-07-27 in a fedora:44 container: initial-setup 0.3.101 ships
# initial-setup.service; text UI needs only anaconda-tui + python3-simpleline.
#
# It lives in base rather than desktop-common (where it was until the headless
# session layer landed): it is a console text UI with nothing desktop about it,
# and de/headless skips desktop-common entirely, so a headless image would
# otherwise install with no first account and no greeter to create one.
if [[ "${FIRSTBOOT:-interactive}" == "interactive" ]]; then
  PACKAGES+=" initial-setup"
  SERVICES_ENABLE="initial-setup.service"
fi
